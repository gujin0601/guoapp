name: Build Windows zhenguojian

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $roots = @(
            'C:\ProgramData\mingw64',
            'C:\msys64\mingw64',
            'C:\mingw64',
            'C:\tools\mingw64',
            'C:\ProgramData\chocolatey\lib\mingw'
          )
          $gcc = (Get-Command 'gcc.exe' -ErrorAction SilentlyContinue).Source
          if (-not $gcc) {
            $gcc = Get-ChildItem -Path $roots -Recurse -Filter 'gcc.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $gcc) { throw 'MinGW-w64 gcc not found' }
          (Split-Path $gcc -Parent) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gcc --version
      - run: python scripts/build_windows.py --all-sources
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
